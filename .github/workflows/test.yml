name: test

# Callable by other workflows. The suite is defined ONCE here and consumed by
# both the PR gate and the release — were each to have its own, the two would
# fire in parallel on merge and a release could ship with a red suite.
on:
  workflow_call:

# Runs pnpm lifecycle scripts and cargo build scripts — third-party code. Read
# only, nothing else. (The release job has its own `contents: write`, which is
# still needed there.)
permissions:
  contents: read

jobs:
  test:
    # macOS rather than Linux: the `tauri` crate pulls system dependencies on
    # Linux (webkit2gtk and friends) and the app is macOS-only — testing on the
    # target platform is truer. Public repo, so the minutes are free.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Tipos (svelte-check)
        run: pnpm check

      - name: Testes do frontend
        run: pnpm test

      - name: Build do frontend
        run: pnpm build

      - name: Testes do Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Testes dos scripts de CI
        run: |
          .github/scripts/next-version.test.sh
          .github/scripts/check-commit-format.test.sh
          .github/scripts/release-notes.test.sh
          .github/scripts/set-version.test.sh
