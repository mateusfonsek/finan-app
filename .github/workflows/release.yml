name: release

# Dispara no merge pra main. A tag NÃO é mais o gatilho — ela passa a ser
# consequência: o workflow calcula a versão, builda e cria a tag.
on:
  push:
    branches: [main]

# Dois merges seguidos não podem correr um sobre o outro: o segundo precisa
# enxergar a tag criada pelo primeiro pra calcular o bump certo.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: `git describe` precisa das tags.
          fetch-depth: 0

      - name: Calcular a próxima versão
        id: version
        run: |
          # `pipefail`: o shell padrão do Actions é `bash -e {0}`, e sem
          # pipefail o status de um pipeline é só o do último comando. Se o
          # `git log` abaixo falhar (SHA inalcançável, clone raso), o
          # next-version.sh recebe entrada VAZIA, conclui "nada releasável" e
          # sai 0 — o merge passaria batido sem release e sem erro nenhum.
          set -euo pipefail

          current=$(node -p "require('./package.json').version")
          last_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$last_tag" ]; then range="$last_tag..HEAD"; else range=HEAD; fi

          # %x00 separa os commits: o script trata só a PRIMEIRA linha de cada
          # registro como cabeçalho. Com `--format=%B` puro, uma linha de corpo
          # tipo "fix: ..." num commit `chore:` viraria release de patch.
          next=$(git log --format='%B%x00' "$range" | .github/scripts/next-version.sh "$current")

          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "range=$range" >> "$GITHUB_OUTPUT"

          if [ -z "$next" ]; then
            echo "Nenhum commit releasável desde ${last_tag:-o início do repo}."
            echo "Encerrando sem release — é o comportamento esperado para merges"
            echo "de docs/chore/test/ci/refactor."
          else
            echo "Versão: $current → $next"
          fi

      - name: Conferir que a tag ainda não existe
        if: steps.version.outputs.next != ''
        run: |
          if git rev-parse "v${{ steps.version.outputs.next }}" >/dev/null 2>&1; then
            echo "::error::a tag v${{ steps.version.outputs.next }} já existe"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.next != ''
        with:
          version: 11

      - uses: actions/setup-node@v4
        if: steps.version.outputs.next != ''
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.next != ''
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.next != ''
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        if: steps.version.outputs.next != ''
        run: pnpm install --frozen-lockfile

      # A ORDEM daqui pra baixo não é intercambiável: o Tauri assa a versão do
      # tauri.conf.json dentro do bundle, então buildar antes do bump geraria
      # um .dmg carimbado com a versão velha. E commitar antes do build
      # deixaria o main com uma versão que não virou release se o build
      # quebrasse. Bump no working tree → build → só então commitar.
      - name: Escrever a versão nos arquivos
        if: steps.version.outputs.next != ''
        run: .github/scripts/set-version.sh "${{ steps.version.outputs.next }}"

      - name: Build universal (Apple Silicon + Intel)
        if: steps.version.outputs.next != ''
        run: pnpm tauri build --target universal-apple-darwin

      - name: Commit, tag e push
        if: steps.version.outputs.next != ''
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): v${{ steps.version.outputs.next }} [skip ci]"

          # Duas invariantes protegem este bloco, e as duas têm que se manter
          # se alguém for mexer aqui:
          #
          # 1. `git tag -a` (ANOTADA), não leve. Uma tag leve (`git tag
          #    v1.2.3`) é simplesmente IGNORADA por `--follow-tags` — só
          #    tags anotadas viajam com ele. Isso já foi bug aqui uma vez.
          #
          # 2. O push do commit e o push da tag têm que ser UM push atômico
          #    (`--atomic`, dois refs), não dois `git push` separados. Com
          #    dois pushes, dá pra o primeiro (o commit em HEAD:main) ir e o
          #    segundo (a tag) falhar — rede, permissão, o que for. O `gh
          #    release create` logo abaixo até esconde o estrago criando a
          #    tag que faltou, mas na ponta do branch padrão, não neste
          #    commit. E se o `gh` também falhar, o main fica com um
          #    `chore(release):` sem tag nenhuma: a próxima execução
          #    recalcula a MESMA versão, builda de novo (~10min de runner
          #    macOS) e morre no `git commit` (nada staged pra commitar),
          #    exigindo conserto manual. `--atomic` faz os dois refs se
          #    moverem juntos ou nenhum se mover — sem o estado intermediário
          #    "commit foi, tag não". Todo o resto do fluxo — o `git
          #    describe` do cálculo de versão, o guard de "tag já existe", a
          #    prevenção de loop — assume que a tag foi criada AQUI, junto
          #    com o commit.
          git tag -a "v${{ steps.version.outputs.next }}" -m "v${{ steps.version.outputs.next }}"
          git push --atomic origin HEAD:main "refs/tags/v${{ steps.version.outputs.next }}"

      - name: Publicar a release
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `pipefail` porque o shell padrão do Actions é `bash -e {0}`, SEM
          # ele: num pipeline, o status que conta é o do ÚLTIMO comando. Sem
          # pipefail, um `git log` que falha (ou um glob de .dmg que não casa)
          # é engolido pelo `head`/pelo script seguinte, a variável sai vazia
          # e o `set -e` nunca dispara — a falha só reaparece lá no `gh`, com
          # uma mensagem que não aponta pra causa.
          set -euo pipefail

          # `ls *.dmg | head -1` sob `pipefail` não protege nada: quando o
          # glob não casa, é a ATRIBUIÇÃO que falha ("ls: ... No such file or
          # directory"), o `set -e` mata o step ali mesmo e o `[ ! -f ]` nem
          # chega a rodar — o `::error::` abaixo nunca aparece, só o erro cru
          # do `ls`. Fora isso, `ls | head -1` pode sair 141 (SIGPIPE) se a
          # listagem for grande o bastante pra estourar o buffer do pipe.
          # Um array com glob resolve os dois: a expansão vazia vira um
          # array vazio (com `nullglob`, sem isso o padrão literal `*.dmg`
          # sobraria como "arquivo"), testável em shell puro, sem subshell
          # nem pipe.
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::nenhum .dmg encontrado em src-tauri/target/universal-apple-darwin/release/bundle/dmg/ — o build do Tauri não produziu o bundle esperado"
            exit 1
          fi
          if [ ${#dmgs[@]} -gt 1 ]; then
            # Inesperado (o bundler do Tauri produz um único .dmg universal):
            # avisa em vez de escolher em silêncio.
            echo "aviso: ${#dmgs[@]} arquivos .dmg encontrados, usando o primeiro: ${dmgs[0]}"
          fi
          dmg="${dmgs[0]}"
          echo "Anexando: $dmg"

          # Só o .dmg. O .tar.gz que o tauri-action anexava (e que era apagado
          # na mão) simplesmente nunca é enviado.
          git log --format=%s "${{ steps.version.outputs.range }}" \
            | .github/scripts/release-notes.sh > /tmp/notes.md

          gh release create "v${{ steps.version.outputs.next }}" \
            --title "finan v${{ steps.version.outputs.next }}" \
            --notes-file /tmp/notes.md \
            "$dmg"
