[package]
name = "finan"
version = "0.1.0"
description = "finan — app local de finanças pessoais"
edition = "2021"
rust-version = "1.77"

[lib]
name = "finan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
